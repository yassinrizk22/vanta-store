<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTA</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#fff;
  --muted:#9a9a9a;
  --line:#121212;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* ===== SOFT BACKGROUND GLOW ===== */
body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle, rgba(255,255,255,0.06), transparent);
  top:-150px;
  left:-150px;
  filter:blur(120px);
  z-index:0;
}

body::after{
  content:"";
  position:fixed;
  width:400px;
  height:400px;
  background:radial-gradient(circle, rgba(255,255,255,0.04), transparent);
  bottom:-150px;
  right:-150px;
  filter:blur(120px);
  z-index:0;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 60px;
  position:fixed;
  width:100%;
  z-index:10;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

nav a{
  margin-left:22px;
  color:var(--muted);
  text-decoration:none;
  transition:.25s;
}
nav a:hover{color:#fff}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 80px;
  position:relative;
  z-index:1;
}

/* LINE EFFECT */
.hero::before{
  content:"";
  position:absolute;
  width:60%;
  height:1px;
  background:linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
  top:20%;
  left:20%;
}

.hero::after{
  content:"";
  position:absolute;
  width:60%;
  height:1px;
  background:linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
  bottom:20%;
  left:20%;
}

.text h1{
  font-size:90px;
  font-family:'Playfair Display',serif;
  letter-spacing:12px;
  margin:0 0 8px;
}

.text h2{
  font-size:24px;
  opacity:.6;
  letter-spacing:6px;
  margin:0;
}

.btn{
  margin-top:26px;
  display:inline-block;
  padding:14px 30px;
  background:#fff;
  color:#000;
  text-decoration:none;
  transition:.25s;
}
.btn:hover{
  background:#e6e6e6;
  transform:translateY(-2px);
}

/* MODEL */
.model{
  width:460px;
  transition:.2s;
  filter:drop-shadow(0 0 40px rgba(255,255,255,.08));
}

/* CONTACT */
.contact{
  position:fixed;
  bottom:30px;
  left:30px;
  display:flex;
  flex-direction:column;
  gap:18px;
  z-index:2;
}

.icon{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  opacity:.6;
  transition:.25s;
  text-decoration:none;
}

.icon svg{
  width:22px;
  height:22px;
  stroke:#aaa;
  fill:none;
  stroke-width:1.8;
  transition:.25s;
}

.icon span{
  color:#aaa;
  font-size:14px;
  letter-spacing:.05em;
  transition:.25s;
}

.icon:hover{
  opacity:1;
  transform:translateX(10px);
}

.icon:hover svg{stroke:#fff;}
.icon:hover span{color:#fff;}

/* FOOTER */
footer{
  text-align:center;
  padding:60px 20px;
  border-top:1px solid var(--line);
  position:relative;
  z-index:1;
}

footer h3{letter-spacing:6px;}

footer p{
  opacity:.6;
  max-width:600px;
  margin:auto;
  line-height:1.7;
}

/* RESPONSIVE */
@media(max-width:900px){
nav{padding:15px 20px;}

.hero{
  flex-direction:column;
  justify-content:center;
  text-align:center;
  padding:120px 20px 40px;
  gap:40px;
  height:auto;
}

.text h1{
  font-size:48px;
  letter-spacing:6px;
}

.text h2{
  font-size:16px;
  letter-spacing:3px;
}

.model{width:260px;}
}

@media(max-width:500px){
.text h1{font-size:36px;}
.model{width:220px;}
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div>VANTA</div>
<div>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="about.html">About</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<div class="text">
<h1>VANTA</h1>
<h2>OWN YOUR LOOK</h2>
<a href="shop.html" class="btn">Shop Now</a>
</div>

<img src="model.png" class="model" id="model">
</section>

<!-- CONTACT -->
<div class="contact">

<!-- 🔥 Instagram (تم التعديل فقط) -->
<a class="icon" href="https://www.instagram.com/_vanta_store_?igsh=MWJ6MnFkOTV5NWRxbg%3D%3D&utm_source=qr" target="_blank">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"/>
<circle cx="12" cy="12" r="4"/>
<circle cx="17.5" cy="6.5" r="1"/>
</svg>
<span>Instagram</span>
</a>

<!-- WhatsApp -->
<a class="icon" href="https://wa.me/201093265201" target="_blank">
<svg viewBox="0 0 24 24">
<path d="M21 11.5a8.5 8.5 0 10-15.3 5l-1.2 4.5 4.6-1.2A8.5 8.5 0 0021 11.5z"/>
<path d="M9 10c.3 1 1.6 2.7 3.2 3.6 1 .5 1.8.6 2.3.4.5-.2 1-.8 1.1-1.2.1-.3.1-.6 0-.7-.1-.1-.3-.2-.6-.4l-1-.4c-.3-.1-.5-.1-.7.1l-.5.6c-.1.2-.3.2-.6.1-.7-.3-1.6-1.1-2-1.8-.2-.3-.1-.5.1-.6l.5-.5c.2-.2.2-.4.1-.7l-.4-1c-.1-.3-.3-.5-.4-.6-.1-.1-.4-.1-.7 0-.4.1-1 .6-1.2 1.1-.2.5-.1 1.3.3 2.1z"/>
</svg>
<span>WhatsApp</span>
</a>

</div>

<!-- FOOTER -->
<footer>
<h3>OWN YOUR LOOK</h3>
<p>
VANTA is more than clothing — it's identity, confidence, and simplicity.
Designed for those who stand out without trying.
</p>
</footer>

<script>
if(window.innerWidth > 768){
document.addEventListener("mousemove",(e)=>{
let x=(e.clientX/window.innerWidth-0.5)*40;
let y=(e.clientY/window.innerHeight-0.5)*40;
document.getElementById("model").style.transform=`translate(${x}px,${y}px)`;
});
}
</script>

</body>
</html>
