<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTA</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#fff;
  --muted:#9a9a9a;
  --line:#121212;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
  position:relative;
}

/* ===== BACKGROUND GLOW ===== */
body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle, rgba(255,255,255,0.06), transparent);
  top:-150px;
  left:-150px;
  filter:blur(120px);
  z-index:0;
}

body::after{
  content:"";
  position:fixed;
  width:400px;
  height:400px;
  background:radial-gradient(circle, rgba(255,255,255,0.04), transparent);
  bottom:-150px;
  right:-150px;
  filter:blur(120px);
  z-index:0;
}

/* 🔥 GEOMETRIC CIRCLES */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  z-index:0;
  overflow:hidden;
}

.circle{
  position:absolute;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:50%;
  animation:rotate 25s linear infinite;
}

.circle:nth-child(1){
  width:400px;
  height:400px;
  top:20%;
  left:10%;
}

.circle:nth-child(2){
  width:600px;
  height:600px;
  bottom:10%;
  right:10%;
  animation-duration:35s;
}

@keyframes rotate{
  from{transform:rotate(0);}
  to{transform:rotate(360deg);}
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 60px;
  position:fixed;
  width:100%;
  z-index:10;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

nav a{
  margin-left:22px;
  color:var(--muted);
  text-decoration:none;
}
nav a:hover{color:#fff}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 80px;
  position:relative;
  z-index:1;
}

.text h1{
  font-size:90px;
  font-family:'Playfair Display',serif;
  letter-spacing:12px;
}
.text h2{
  font-size:24px;
  opacity:.6;
}

.btn{
  margin-top:20px;
  display:inline-block;
  padding:14px 30px;
  background:#fff;
  color:#000;
  text-decoration:none;
}

/* 🔥 MODEL ANIMATION */
.model{
  width:460px;
  animation:float 4s ease-in-out infinite;
  filter:drop-shadow(0 0 40px rgba(255,255,255,.15));
  transition:.3s;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-20px);}
  100%{transform:translateY(0);}
}

/* FEATURED */
.featured{
  padding:100px 60px;
  text-align:center;
  position:relative;
  z-index:1;
}

.featured h2{
  font-family:'Playfair Display',serif;
  letter-spacing:8px;
  margin-bottom:40px;
}

.featured-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:30px;
}

.f-card{
  background:#0a0a0a;
  border:1px solid #1a1a1a;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}

.f-card:hover{
  transform:translateY(-10px);
}

.f-card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.f-info{padding:15px}

/* INSTAGRAM */
.insta{
  padding:100px 60px;
  text-align:center;
  position:relative;
  z-index:1;
}

.insta-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.insta-grid img{
  width:100%;
  height:220px;
  object-fit:cover;
  transition:.4s;
}

.insta-grid img:hover{
  transform:scale(1.05);
}

/* FOOTER */
footer{
  text-align:center;
  padding:60px 20px;
  border-top:1px solid var(--line);
  position:relative;
  z-index:1;
}
</style>
</head>

<body>

<!-- 🔥 BACKGROUND SHAPES -->
<div class="bg">
<div class="circle"></div>
<div class="circle"></div>
</div>

<!-- NAV -->
<nav>
<div>VANTA</div>
<div>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="about.html">About</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<div class="text">
<h1>VANTA</h1>
<h2>STAND OUT ALWAYS</h2>
<a href="shop.html" class="btn">Shop Now</a>
</div>

<img src="model.png" class="model">
</section>

<!-- FEATURED -->
<section class="featured">
<h2>FEATURED</h2>
<div id="featuredProducts" class="featured-grid"></div>
</section>

<!-- FOLLOW VANTA -->
<section class="insta">
<h2>FOLLOW VANTA</h2>

<div class="insta-grid">
<img src="vanta/vanta1.png">
<img src="vanta/vanta2.png">
<img src="vanta/vanta3.png">
<img src="vanta/vanta4.png">
</div>

</section>

<footer>
<h3>VANTA STAND OUT ALWAYS</h3>
<p>VANTA is more than clothing — it's identity.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const supa = supabase.createClient(
"https://ojtrvxaptsavzmzjymci.supabase.co",
"sb_publishable_Qv9Pl1_DfFf4wEHS_ApMTQ_FuoR0ylh"
);

async function loadFeatured(){
let {data} = await supa.from("products").select("*").limit(4);
let container = document.getElementById("featuredProducts");

data.forEach(p=>{
container.innerHTML += `
<div class="f-card" onclick="location.href='product.html?id=${p.id}'">
<img src="${p.image}">
<div class="f-info">
<h4>${p.name}</h4>
<p>${p.price} EGP</p>
</div>
</div>`;
});
}
loadFeatured();
</script>

</body>
</html>
