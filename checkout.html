<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VANTA Checkout</title>

<!-- ✅ دعم الموبايل -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:'Montserrat';
overflow-x:hidden; /* ✅ منع الاسكرول الجانبي */
}

.container{
max-width:600px;
margin:60px auto;
background:#111;
padding:30px;
border-radius:15px;
}

h2{
font-family:'Playfair Display';
margin-bottom:20px;
}

input, select{
width:100%;
padding:12px;
margin-bottom:12px;
background:#000;
border:1px solid #333;
color:#fff;
}

button{
width:100%;
padding:14px;
background:#fff;
color:#000;
border:none;
cursor:pointer;
transition:.3s;
}

.product{
background:#000;
padding:12px;
margin-bottom:15px;
border:1px solid #222;
display:flex;
flex-direction:column;
gap:10px;
}

.item{
display:flex;
align-items:center;
gap:10px;
border-bottom:1px solid #222;
padding-bottom:10px;
}

.item img{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px;
}

.success{
display:none;
text-align:center;
}

/* ===== 📱 MOBILE RESPONSIVE ===== */
@media (max-width:768px){

.container{
margin:20px;
padding:20px;
border-radius:12px;
}

h2{
font-size:20px;
text-align:center;
}

input, select{
font-size:16px;
}

button{
font-size:16px;
padding:12px;
}

.item{
gap:8px;
}

.item img{
width:60px;
height:60px;
}

}
</style>
</head>

<body>

<div class="container" id="formBox">

<h2>Complete Your Order</h2>

<div id="product" class="product"></div>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone Number">
<input id="governorate" placeholder="Governorate">

<select id="size">
<option value="">Select Size</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<select id="payment">
<option value="cod">Cash on Delivery</option>
<option value="fawry">Fawry</option>
</select>

<button onclick="submitOrder()">Place Order</button>

</div>

<div class="container success" id="successBox">
<h2>Order Confirmed 🖤</h2>
<p id="orderId"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const client = supabase.createClient(
"https://ojtrvxaptsavzmzjymci.supabase.co",
"sb_publishable_Qv9Pl1_DfFf4wEHS_ApMTQ_FuoR0ylh"
);

/* 🔥 توحيد السعر */
function getPrice(p){
if(!p) return 0;
if(typeof p === "number") return p;

let clean = (p+"").replace(/[^\d.]/g,'');
let num = parseFloat(clean);
return isNaN(num) ? 0 : num;
}

/* 🔥 توحيد الصورة */
function getImage(obj){
return obj.img || obj.image || "https://via.placeholder.com/70";
}

/* 📦 البيانات */
let order = JSON.parse(localStorage.getItem("orderNow"));
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let productBox = document.getElementById("product");

/* 🖼️ عرض المنتج */
if(order){

productBox.innerHTML = `
<div class="item">
<img src="${getImage(order)}">
<div>
<b>${order.n || order.name}</b><br>
${getPrice(order.p || order.price)} EGP
</div>
</div>
`;

}

else if(cart.length > 0){

let html = "";

cart.forEach(i=>{
html += `
<div class="item">
<img src="${getImage(i)}">
<div>
<b>${i.n || i.name}</b><br>
${getPrice(i.p || i.price)} EGP
</div>
</div>
`;
});

productBox.innerHTML = html;

}

/* 🔢 Order ID */
function generateOrderId(){
return "VANTA-" + Math.floor(Math.random()*1000000);
}

/* 🚀 إرسال الطلب */
async function submitOrder(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let phone = document.getElementById("phone").value;
let gov = document.getElementById("governorate").value;
let size = document.getElementById("size").value;
let payment = document.getElementById("payment").value;

if(!name || !phone || !gov){
alert("Fill required fields");
return;
}

/* المستخدم */
let { data } = await client.auth.getUser();
let user = data.user;

let orderId = generateOrderId();

/* إدخال */
if(order){

await client.from("orders").insert([{
user_id: user?.id || null,
name:name,
email:email,
phone:phone,
governorate:gov,
size:size,
product:order.n || order.name,
price:getPrice(order.p || order.price),
image:getImage(order),
payment_method:payment,
status:"pending"
}]);

}

else if(cart.length > 0){

for(let i of cart){

await client.from("orders").insert([{
user_id: user?.id || null,
name:name,
email:email,
phone:phone,
governorate:gov,
size:i.size,
product:i.n || i.name,
price:getPrice(i.p || i.price),
image:getImage(i),
payment_method:payment,
status:"pending"
}]);

}

}

/* تنظيف */
localStorage.removeItem("orderNow");
localStorage.removeItem("cart");

/* نجاح */
document.getElementById("formBox").style.display="none";
document.getElementById("successBox").style.display="block";

document.getElementById("orderId").innerText = "Order ID: " + orderId;

}
</script>

</body>
</html>
