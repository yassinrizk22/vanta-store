<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VANTA Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:'Montserrat';
}

.container{
max-width:600px;
margin:50px auto;
background:#0a0a0a;
padding:30px;
border-radius:16px;
border:1px solid #1a1a1a;
}

h2{
text-align:center;
font-family:'Playfair Display';
}

.item{
display:flex;
gap:12px;
margin-bottom:12px;
border-bottom:1px solid #222;
padding-bottom:10px;
}

.item img{
width:70px;
height:70px;
border-radius:8px;
object-fit:cover;
}

input{
width:100%;
padding:12px;
margin-top:10px;
background:#000;
border:1px solid #333;
color:#fff;
border-radius:10px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
cursor:pointer;
}

.main-btn{
background:#fff;
color:#000;
}

.wa-btn{
background:linear-gradient(135deg,#25D366,#1ebe5d);
color:#fff;
}

.total{
display:flex;
justify-content:space-between;
margin-top:10px;
padding-top:10px;
border-top:1px solid #222;
}
</style>
</head>

<body>

<div class="container">

<h2>Complete Your Order</h2>

<div id="products"></div>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="gov" placeholder="Governorate">

<button class="main-btn" onclick="submitOrder()">Place Order</button>
<button class="wa-btn" onclick="orderWhatsApp()">Order via WhatsApp</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const client = supabase.createClient(
"https://ojtrvxaptsavzmzjymci.supabase.co",
"sb_publishable_Qv9Pl1_DfFf4wEHS_ApMTQ_FuoR0ylh"
);

const WHATSAPP_NUMBER = "201093265201";

/* DATA */
let order = JSON.parse(localStorage.getItem("orderNow"));
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("products");
let total = 0;

/* عرض المنتجات */
function renderItem(i){
let price = parseFloat(i.price) || 0;
total += price;

return `
<div class="item">
<img src="${i.image}">
<div>
<b>${i.name}</b><br>
${i.color || ''} ${i.size ? '| Size: '+i.size : ''}<br>
${price} EGP
</div>
</div>
`;
}

if(order){
container.innerHTML = renderItem(order);
}else{
let html="";
cart.forEach(i=> html+=renderItem(i));
container.innerHTML = html;
}

container.innerHTML += `
<div class="total">
<span>Total</span>
<span>${total} EGP</span>
</div>
`;

/* 🔥 ORDER TO SUPABASE */
async function submitOrder(){

let name = document.getElementById("name").value.trim();
let phone = document.getElementById("phone").value.trim();
let gov = document.getElementById("gov").value.trim();

if(!name || !phone || !gov){
alert("Please fill all fields");
return;
}

let items = order ? [order] : cart;

let ordersToInsert = items.map(i => ({
name,
phone,
governorate: gov,
product: i.name,
price: Number(i.price) || 0,
size: i.size || "",
color: i.color || "",
image: i.image || "",
status: "pending"
}));

let { error } = await client.from("orders").insert(ordersToInsert);

if(error){
console.error(error);
alert("Error: " + error.message);
return;
}

alert("Order placed successfully ✔");

/* تنظيف */
localStorage.removeItem("orderNow");
localStorage.removeItem("cart");

}

/* 🔥 WHATSAPP */
function orderWhatsApp(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let gov = document.getElementById("gov").value;

if(!name || !phone || !gov){
alert("Please fill all fields");
return;
}

let items = order ? [order] : cart;
let firstImage = items[0]?.image || "";

let msg = `${firstImage}

*VANTA ORDER*

------------------------

`;

items.forEach((i,index)=>{
msg += `Product ${index+1}
Name: ${i.name}
Price: ${i.price} EGP
Size: ${i.size || "-"}

`;

if(i.color) msg += `Color: ${i.color}\n`;

msg += `
------------------------

`;
});

msg += `Customer Info
Name: ${name}
Phone: ${phone}
Location: ${gov}

------------------------

Please confirm my order`;

let url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
window.open(url,"_blank");
}

</script>

</body>
</html>
