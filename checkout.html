<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VANTA Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:'Montserrat';
}

.container{
max-width:600px;
margin:50px auto;
background:#0a0a0a;
padding:30px;
border-radius:16px;
border:1px solid #1a1a1a;
}

h2{
text-align:center;
font-family:'Playfair Display';
}

.item{
display:flex;
gap:12px;
margin-bottom:12px;
border-bottom:1px solid #222;
padding-bottom:10px;
}

.item img{
width:70px;
height:70px;
border-radius:8px;
object-fit:cover;
}

input{
width:100%;
padding:12px;
margin-top:10px;
background:#000;
border:1px solid #333;
color:#fff;
border-radius:10px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
cursor:pointer;
}

.main-btn{
background:#fff;
color:#000;
}

.wa-btn{
background:linear-gradient(135deg,#25D366,#1ebe5d);
color:#fff;
}

.total{
display:flex;
justify-content:space-between;
margin-top:10px;
padding-top:10px;
border-top:1px solid #222;
}

/* ✅ SUCCESS BOX */
#successBox{
display:none;
text-align:center;
margin-top:40px;
}

#successBox h3{
font-family:'Playfair Display';
font-size:26px;
margin-bottom:10px;
}

#successBox p{
opacity:.7;
}

#successBox button{
margin-top:20px;
background:#fff;
color:#000;
}
</style>
</head>

<body>

<div class="container" id="mainBox">

<h2>إتمام الطلب</h2>

<div id="products"></div>

<input id="name" placeholder="الاسم بالكامل">
<input id="phone" placeholder="رقم الهاتف">
<input id="gov" placeholder="المحافظة">

<button class="main-btn" onclick="submitOrder()">تأكيد الطلب</button>
<button class="wa-btn" onclick="orderWhatsApp()">اطلب عبر واتساب</button>

</div>

<!-- ✅ رسالة النجاح -->
<div id="successBox">
<h3>شكراً لتسوقك من VANTA ❤️</h3>
<p>نقدر ثقتك في منتجاتنا، وطلبك قيد التنفيذ حالياً.</p>

<button onclick="goShop()">الرجوع للتسوق</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const client = supabase.createClient(
"https://ojtrvxaptsavzmzjymci.supabase.co",
"sb_publishable_Qv9Pl1_DfFf4wEHS_ApMTQ_FuoR0ylh"
);

const WHATSAPP_NUMBER = "201093265201";

/* DATA */
let order = JSON.parse(localStorage.getItem("orderNow"));
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("products");
let total = 0;

/* عرض المنتجات */
function renderItem(i){
let price = parseFloat(i.price) || 0;
total += price;

return `
<div class="item">
<img src="${i.image}">
<div>
<b>${i.name}</b><br>
${i.color || ''} ${i.size ? '| المقاس: '+i.size : ''}<br>
${price} EGP
</div>
</div>
`;
}

if(order){
container.innerHTML = renderItem(order);
}else{
let html="";
cart.forEach(i=> html+=renderItem(i));
container.innerHTML = html;
}

container.innerHTML += `
<div class="total">
<span>الإجمالي</span>
<span>${total} EGP</span>
</div>
`;

/* 🔥 ORDER */
async function submitOrder(){

let name = document.getElementById("name").value.trim();
let phone = document.getElementById("phone").value.trim();
let gov = document.getElementById("gov").value.trim();

if(!name || !phone || !gov){
alert("من فضلك املى كل البيانات");
return;
}

let items = order ? [order] : cart;

let ordersToInsert = items.map(i => ({
name,
phone,
governorate: gov,
product: i.name,
price: Number(i.price) || 0,
size: i.size || "",
color: i.color || "",
image: i.image || "",
status: "pending"
}));

let { error } = await client.from("orders").insert(ordersToInsert);

if(error){
alert("حصل خطأ: " + error.message);
return;
}

/* تنظيف */
localStorage.removeItem("orderNow");
localStorage.removeItem("cart");

/* إخفاء الفورم */
document.getElementById("mainBox").style.display = "none";

/* إظهار رسالة النجاح */
document.getElementById("successBox").style.display = "block";

}

/* 🔥 WHATSAPP */
function orderWhatsApp(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let gov = document.getElementById("gov").value;

if(!name || !phone || !gov){
alert("من فضلك املى كل البيانات");
return;
}

let items = order ? [order] : cart;
let firstImage = items[0]?.image || "";

let msg = `${firstImage}

*VANTA ORDER*

------------------------

`;

items.forEach((i,index)=>{
msg += `منتج ${index+1}
الاسم: ${i.name}
السعر: ${i.price} EGP
المقاس: ${i.size || "-"}

`;

if(i.color) msg += `اللون: ${i.color}\n`;

msg += `
------------------------

`;
});

msg += `بيانات العميل
الاسم: ${name}
الموبايل: ${phone}
المحافظة: ${gov}

------------------------

يرجى تأكيد الطلب`;

let url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
window.open(url,"_blank");
}

/* 🔥 رجوع للتسوق */
function goShop(){
window.location.href = "shop.html";
}
</script>

</body>
</html>
