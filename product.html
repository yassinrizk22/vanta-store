<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VANTA Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #0a0a0a, #000);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
        }

        /* NAV */
        nav {
            padding: 10px 30px;
            border-bottom: 1px solid #111;
            font-family: 'Playfair Display', serif;
            letter-spacing: 4px;
        }

        /* LAYOUT */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            padding: 30px;
            justify-content: center;
            animation: fadeUp .8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* IMAGE */
        .zoom-box {
            width: 300px;
            height: 300px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 255, 255, .05);
        }

        .zoom-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .3s;
            cursor: zoom-in;
        }

        .zoom-box:hover img {
            transform: scale(1.05);
        }

        /* INFO */
        .info {
            max-width: 380px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
        }

        #price {
            font-size: 18px;
            margin: 10px 0;
        }

        .line {
            width: 50px;
            height: 2px;
            background: #fff;
            opacity: .2;
            margin: 15px 0;
        }

        /* COLORS */
        .colors {
            display: flex;
            gap: 10px;
        }

        .color {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #333;
            transition: .3s;
        }

        .color::after {
            content: "";
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: currentColor;
        }

        .color:hover {
            transform: scale(1.2);
        }

        .color.active {
            border: 2px solid #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, .4);
        }

        /* SIZE */
        .size-title {
            margin-top: 10px;
            opacity: .6;
            font-size: 12px;
        }

        .sizes {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .size {
            padding: 8px 12px;
            border: 1px solid #333;
            cursor: pointer;
            border-radius: 8px;
            font-size: 12px;
            transition: .3s;
            background: #0a0a0a;
        }

        .size:hover {
            border-color: #fff;
            transform: translateY(-2px);
        }

        .size.active {
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, .3);
        }

        .size.disabled {
            opacity: .3;
            pointer-events: none;
        }

        /* BUTTONS */
        button {
            position: relative;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            transition: .3s;
        }

        .add {
            background: linear-gradient(145deg, #fff, #e6e6e6);
            color: #000;
        }

        .order {
            background: #0a0a0a;
            color: #fff;
            border: 1px solid #333;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button::before {
            content: "";
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .4), transparent);
            transition: .5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:active {
            transform: scale(.97);
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #111;
            padding: 12px;
            opacity: 0;
            transition: .3s;
        }

        .toast.show {
            opacity: 1;
        }

        /* REVIEWS */
        .reviews-section {
            width: 80%; /* Adjust width to take more space */
            margin: 0 auto; /* Center align */
            padding: 15px;
            background: #222;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            margin-top: 40px;
        }

        .reviews-section h3 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .reviews-list {
            margin-bottom: 15px;
        }

        .review {
            background: #333;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .review p {
            font-size: 14px;
            color: #ddd;
        }

        .review .author {
            font-size: 14px;
            color: #aaa;
            margin-top: 8px;
        }

        .review-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
        }

        .submit-review {
            padding: 10px 15px;
            background-color: #555;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }

        .submit-review:hover {
            background-color: #666;
        }

        .stars {
            display: flex;
            gap: 5px;
        }

        .star {
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }

        .star.active {
            color: gold;
        }
    </style>
</head>

<body>

    <nav>VANTA</nav>

    <div class="container">

        <div class="zoom-box">
            <img id="img">
        </div>

        <div class="info">
            <h2 id="name"></h2>
            <p id="price"></p>

            <div class="line"></div>

            <p id="colorName">Color: -</p>
            <div id="colors" class="colors"></div>

            <p class="size-title">Select Size</p>
            <div id="sizes" class="sizes"></div>

            <button class="add" onclick="add()">Add to Cart</button>
            <button class="order" onclick="orderNow()">Order Now</button>
        </div>

    </div>

    <!-- Reviews Section -->
    <div class="reviews-section">
        <h3>Customer Reviews</h3>
        <div id="reviews-list" class="reviews-list">
            <!-- Reviews will be dynamically loaded here -->
        </div>
        <div class="review-form">
            <input type="text" id="reviewer-name" placeholder="Your Name" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #333; color: #fff; border: 1px solid #444; border-radius: 8px;">
            <textarea id="review-text" placeholder="Write your review here..." rows="4"></textarea>

            <!-- Star Rating -->
            <div class="stars">
                <span class="star" onclick="rate(1)">★</span>
                <span class="star" onclick="rate(2)">★</span>
                <span class="star" onclick="rate(3)">★</span>
                <span class="star" onclick="rate(4)">★</span>
                <span class="star" onclick="rate(5)">★</span>
            </div>

            <button class="submit-review" onclick="submitReview()">Submit Review</button>
        </div>
    </div>

    <div id="fullscreen" class="fullscreen">
        <img id="fullImg">
    </div>

    <div id="transition">
        <div class="logo">VANTA</div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script>
        const client = supabase.createClient(
            "https://ojtrvxaptsavzmzjymci.supabase.co",
            "sb_publishable_Qv9Pl1_DfFf4wEHS_ApMTQ_FuoR0ylh"
        );

        let id = new URLSearchParams(location.search).get("id");
        let product;
        let selectedColor = null;
        let selectedSize = null;
        let rating = 0; // Default rating value

        function showToast(msg) {
            let t = document.getElementById("toast");
            t.innerText = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2000);
        }

        async function load() {
            let { data } = await client.from("products").select("*").eq("id", id).single();
            product = data;

            name.innerText = product.name;
            price.innerText = product.price + " EGP";
            img.src = product.image || "";

            if (product.colors) {
                renderColors();
            }

            initZoom();
            initMobileZoom();
            initSizes();
            loadReviews();  // Load reviews on page load
        }

        function renderColors() {
            let c = document.getElementById("colors");
            let label = document.getElementById("colorName");

            product.colors.forEach((col, i) => {
                let el = document.createElement("div");
                el.className = "color";
                el.style.color = col.hex; // Set the color based on the hex code

                el.onclick = () => {
                    selectedColor = col;
                    img.src = col.image;
                    document.querySelectorAll(".color").forEach(x => x.classList.remove("active"));
                    el.classList.add("active");
                    label.innerHTML = "Color: <span>" + col.name + "</span>";
                    renderSizes(col);  // Re-render sizes based on the selected color
                };

                c.appendChild(el);

                if (i === 0) {
                    selectedColor = col;
                    img.src = col.image;
                    el.classList.add("active");
                    label.innerHTML = "Color: <span>" + col.name + "</span>";
                    renderSizes(col); // Default to first color
                }
            });
        }

        function renderSizes(color) {
            let sizesContainer = document.getElementById("sizes");
            sizesContainer.innerHTML = ''; // Clear previous sizes

            Object.keys(color.sizes).forEach(size => {
                let sizeEl = document.createElement("div");
                sizeEl.className = "size";
                sizeEl.innerText = size;
                sizeEl.dataset.size = size;

                // Disable size if it's not available
                if (color.sizes[size] === 0) {
                    sizeEl.classList.add("disabled");
                } else {
                    sizeEl.onclick = () => {
                        if (sizeEl.classList.contains("disabled")) return;
                        document.querySelectorAll(".size").forEach(x => x.classList.remove("active"));
                        sizeEl.classList.add("active");
                        selectedSize = size;
                    };
                }

                sizesContainer.appendChild(sizeEl);
            });
        }

        function rate(star) {
            rating = star; // Update the rating
            let stars = document.querySelectorAll('.star');
            stars.forEach((el, idx) => {
                if (idx < star) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        async function loadReviews() {
            let { data: reviews, error } = await client
                .from("reviews")
                .select("*")
                .eq("product_id", id);

            if (error) {
                console.error("Error fetching reviews:", error);
                return;
            }

            const reviewsList = document.getElementById("reviews-list");
            reviewsList.innerHTML = ""; // Clear the existing reviews

            reviews.forEach(review => {
                const reviewElement = document.createElement("div");
                reviewElement.classList.add("review");
                reviewElement.innerHTML = `

                    <p>${review.content}</p>
                    <p class="author">By ${review.author_name} | Rating: ${review.rating} ★</p>
                `;
                reviewsList.appendChild(reviewElement);
            });
        }

        async function submitReview() {
            const reviewText = document.getElementById("review-text").value;
            const reviewerName = document.getElementById("reviewer-name").value;

            if (!reviewText.trim()) {
                showToast("Please write a review before submitting.");
                return;
            }

            if (rating === 0) {
                showToast("Please select a rating.");
                return;
            }

            const reviewData = {
                product_id: id, // Ensure it's linked to the current product
                content: reviewText,
                author_name: reviewerName || "Anonymous", // Use provided name or "Anonymous"
                rating: rating,
                created_at: new Date().toISOString(),
            };

            let { error } = await client.from("reviews").insert([reviewData]);

            if (error) {
                console.error("Error submitting review:", error);
                showToast("Failed to submit review. Try again.");
            } else {
                showToast("Review submitted successfully!");
                loadReviews(); // Reload the reviews
                document.getElementById("review-text").value = ""; // Clear the textarea
                document.getElementById("reviewer-name").value = ""; // Clear the name input
                rating = 0; // Reset rating
                rate(0); // Clear selected stars
            }
        }

        function add() {
            if (!selectedSize) {
                showToast("Select size");
                return;
            }

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart.push({
                ...product,
                image: selectedColor?.image,
                color: selectedColor?.name,
                size: selectedSize,
                qty: 1
            });

            localStorage.setItem("cart", JSON.stringify(cart));
            showToast("Added ✔");
        }

        function orderNow() {
            if (!selectedSize) {
                showToast("Select size");
                return;
            }

            localStorage.setItem("orderNow", JSON.stringify({
                ...product,
                image: selectedColor?.image,
                color: selectedColor?.name,
                size: selectedSize,
                qty: 1
            }));

            transition.classList.add("active");

            setTimeout(() => {
                location.href = "checkout.html";
            }, 3500);
        }

        let fullscreen = document.getElementById("fullscreen");
        let fullImg = document.getElementById("fullImg");
        let transition = document.getElementById("transition");

        load();
    </script>

</body>
</html>
