<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VANTA Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:radial-gradient(circle at top,#0a0a0a,#000);
color:#fff;
font-family:'Montserrat',sans-serif;
}

/* NAV */
nav{
padding:20px 60px;
border-bottom:1px solid #111;
font-family:'Playfair Display',serif;
letter-spacing:6px;
}

/* LAYOUT */
.container{
display:flex;
flex-wrap:wrap;
gap:50px;
padding:50px;
justify-content:center;
animation:fadeUp .8s ease;
}
@keyframes fadeUp{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}

/* IMAGE */
.zoom-box{
width:380px;
height:380px;
border-radius:16px;
overflow:hidden;
box-shadow:0 0 60px rgba(255,255,255,.05);
}
.zoom-box img{
width:100%;
height:100%;
object-fit:cover;
transition:.3s;
cursor:zoom-in;
}
.zoom-box:hover img{transform:scale(1.05);}

/* INFO */
.info{max-width:420px;}
h2{font-family:'Playfair Display',serif;font-size:28px;}
#price{font-size:22px;margin:10px 0;}

.line{
width:50px;
height:2px;
background:#fff;
opacity:.2;
margin:15px 0;
}

/* COLORS */
.colors{display:flex;gap:12px;}
.color{
width:34px;height:34px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
cursor:pointer;border:2px solid #333;
transition:.3s;
}
.color::after{
content:"";
width:18px;height:18px;border-radius:50%;
background:currentColor;
}
.color:hover{transform:scale(1.2);}
.color.active{
border:2px solid #fff;
box-shadow:0 0 12px rgba(255,255,255,.4);
}

/* COLOR NAME */
#colorName{margin-top:10px;opacity:.7;}
#colorName span{font-weight:500;}

/* ===== SIZES PREMIUM ===== */
.size-title{
margin-top:15px;
opacity:.6;
font-size:14px;
}

.sizes{
display:flex;
gap:10px;
margin-top:10px;
flex-wrap:wrap;
}

.size{
padding:10px 16px;
border:1px solid #333;
cursor:pointer;
border-radius:8px;
font-size:14px;
transition:.3s;
background:#0a0a0a;
}

.size:hover{
border-color:#fff;
transform:translateY(-2px);
}

.size.active{
background:#fff;
color:#000;
border-color:#fff;
box-shadow:0 0 10px rgba(255,255,255,.3);
}

.size.disabled{
opacity:.3;
pointer-events:none;
}

/* BUTTONS */
button{
position:relative;
width:100%;
padding:14px;
margin-top:14px;
border:none;
cursor:pointer;
border-radius:10px;
overflow:hidden;
transition:.3s;
}

.add{
background:linear-gradient(145deg,#fff,#e6e6e6);
color:#000;
}

.order{
background:#0a0a0a;
color:#fff;
border:1px solid #333;
}

button:hover{transform:translateY(-2px);}

button::before{
content:"";
position:absolute;
left:-100%;
top:0;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
transition:.5s;
}
button:hover::before{left:100%;}
button:active{transform:scale(.97);}

/* TOAST */
.toast{
position:fixed;
bottom:20px;
right:20px;
background:#111;
padding:12px;
opacity:0;
transition:.3s;
}
.toast.show{opacity:1;}

/* FULLSCREEN */
.fullscreen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#000;
display:flex;justify-content:center;align-items:center;
opacity:0;pointer-events:none;
}
.fullscreen.show{opacity:1;pointer-events:all;}
.fullscreen img{width:100%;max-width:600px;}

/* TRANSITION */
#transition{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#000;
display:flex;justify-content:center;align-items:center;
opacity:0;pointer-events:none;
z-index:9999;
transition:.5s;
}
#transition.active{opacity:1;}

.logo{
font-family:'Playfair Display',serif;
font-size:42px;
letter-spacing:22px;
opacity:0;
transform:scale(.7) translateY(80px);
filter:blur(8px);
}

#transition.active .logo{
animation:
logoIn 1.5s forwards,
logoPulse 1.5s 1.5s,
logoOut 1s 3s forwards;
}

@keyframes logoIn{
to{opacity:1;transform:scale(1.2) translateY(0);filter:blur(0);}
}
@keyframes logoPulse{
50%{transform:scale(1.3);}
}
@keyframes logoOut{
to{opacity:0;transform:scale(1.5);}
}

@media(max-width:768px){
.container{padding:20px;}
.zoom-box{width:260px;height:260px;}
}
</style>
</head>

<body>

<nav>VANTA</nav>

<div class="container">

<div class="zoom-box">
<img id="img">
</div>

<div class="info">

<h2 id="name"></h2>
<p id="price"></p>

<div class="line"></div>

<p id="colorName">Color: -</p>
<div id="colors" class="colors"></div>

<p class="size-title">Select Size</p>
<div id="sizes" class="sizes">
<div class="size" data-size="M">M</div>
<div class="size" data-size="L">L</div>
<div class="size" data-size="XL">XL</div>
<div class="size" data-size="XXL">XXL</div>
</div>

<button class="add" onclick="add()">Add to Cart</button>
<button class="order" onclick="orderNow()">Order Now</button>

</div>

</div>

<div id="fullscreen" class="fullscreen">
<img id="fullImg">
</div>

<div id="transition">
<div class="logo">VANTA</div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const client = supabase.createClient(
"https://ojtrvxaptsavzmzjymci.supabase.co",
"sb_publishable_Qv9Pl1_DfFf4wEHS_ApMTQ_FuoR0ylh"
);

let id=new URLSearchParams(location.search).get("id");
let product;
let selectedColor=null;
let selectedSize=null;

function showToast(msg){
let t=document.getElementById("toast");
t.innerText=msg;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2000);
}

async function load(){
let {data}=await client.from("products").select("*").eq("id",id).single();
product=data;

name.innerText=product.name;
price.innerText=product.price+" EGP";
img.src=product.image || "";

if(product.colors){renderColors();}

initZoom();
initMobileZoom();
initSizes();
}

function renderColors(){
let c=document.getElementById("colors");
let label=document.getElementById("colorName");

product.colors.forEach((col,i)=>{
let el=document.createElement("div");
el.className="color";
el.style.color=col.hex;

el.onclick=()=>{
selectedColor=col;
img.src=col.image;
document.querySelectorAll(".color").forEach(x=>x.classList.remove("active"));
el.classList.add("active");
label.innerHTML="Color: <span>"+col.name+"</span>";
};

c.appendChild(el);

if(i===0){
selectedColor=col;
img.src=col.image;
el.classList.add("active");
label.innerHTML="Color: <span>"+col.name+"</span>";
}
});
}

function initSizes(){
document.querySelectorAll(".size").forEach(el=>{
el.onclick=()=>{
if(el.classList.contains("disabled")) return;
document.querySelectorAll(".size").forEach(x=>x.classList.remove("active"));
el.classList.add("active");
selectedSize = el.dataset.size;
};
});
}

/* ZOOM */
function initZoom(){
let box=document.querySelector(".zoom-box");
box.onmousemove=(e)=>{
let r=box.getBoundingClientRect();
let x=(e.clientX-r.left)/r.width;
let y=(e.clientY-r.top)/r.height;
img.style.transformOrigin=`${x*100}% ${y*100}%`;
img.style.transform="scale(2)";
};
box.onmouseleave=()=>img.style.transform="scale(1)";
}

/* MOBILE */
function initMobileZoom(){
img.onclick=()=>{
fullscreen.classList.add("show");
fullImg.src=img.src;
};
fullscreen.onclick=()=>fullscreen.classList.remove("show");
}

/* ADD */
function add(){
if(!selectedSize){showToast("Select size");return;}

let cart=JSON.parse(localStorage.getItem("cart"))||[];

cart.push({
...product,
image:selectedColor?.image,
color:selectedColor?.name,
size:selectedSize,
qty:1
});

localStorage.setItem("cart",JSON.stringify(cart));
showToast("Added ✔");
}

/* ORDER */
function orderNow(){
if(!selectedSize){showToast("Select size");return;}

localStorage.setItem("orderNow",JSON.stringify({
...product,
image:selectedColor?.image,
color:selectedColor?.name,
size:selectedSize,
qty:1
}));

transition.classList.add("active");

setTimeout(()=>{
location.href="checkout.html";
},3500);
}

let fullscreen=document.getElementById("fullscreen");
let fullImg=document.getElementById("fullImg");
let transition=document.getElementById("transition");

load();
</script>

</body>
</html>
