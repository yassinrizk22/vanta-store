<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VANTA Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
:root{
--bg:#000;
--text:#fff;
--muted:#aaa;
--line:#111;
--danger:#ff3b3b;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:'Montserrat',sans-serif;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
border-bottom:1px solid var(--line);
background:rgba(0,0,0,.7);
backdrop-filter:blur(10px);
}

.logo{
font-family:'Playfair Display',serif;
letter-spacing:5px;
}

nav a{
margin-left:20px;
text-decoration:none;
color:var(--muted);
position:relative;
transition:.3s;
font-size:14px;
}

nav a::after{
content:"";
position:absolute;
bottom:-6px;
left:0;
width:0;
height:2px;
background:#fff;
transition:.3s;
}

nav a:hover{color:#fff;}
nav a:hover::after{width:100%;}
nav a.active{color:#fff;}
nav a.active::after{width:100%;}

/* TOP BAR */
.top{
display:flex;
gap:10px;
padding:20px 60px;
flex-wrap:wrap;
}

.top input,
.top select{
padding:10px;
background:#0a0a0a;
color:#fff;
border:1px solid #1a1a1a;
border-radius:6px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:30px;
padding:40px 60px;
}

.card{
background:#0a0a0a;
border:1px solid #1a1a1a;
border-radius:16px;
overflow:hidden;
transition:.3s;
}
.card:hover{transform:translateY(-8px);}

.card img{
width:100%;
height:300px;
object-fit:cover;
transition:.35s;
}

.info{padding:18px;}

/* COLORS */
.colors{display:flex;gap:10px;margin:10px 0;}

.color{
width:22px;height:22px;border-radius:50%;
cursor:pointer;border:2px solid #333;
display:flex;align-items:center;justify-content:center;
transition:.2s;
}
.color::after{
content:"";width:10px;height:10px;border-radius:50%;
background:currentColor;
}
.color:hover{transform:scale(1.15);}
.color.active{border:2px solid #fff;}

.color-name{
font-size:13px;color:#aaa;margin-top:5px;
}

/* BUTTONS */
.btn{
width:100%;
margin-top:10px;
padding:12px;
border:none;
cursor:pointer;
border-radius:8px;
}

.add{background:#fff;color:#000;}
.order{background:#111;color:#fff;border:1px solid #333;}
.view{background:transparent;color:#fff;border:1px solid #555;}

/* ANIMATION */
#transition{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
z-index:9999;
transition:.5s;
}

#transition.active{
opacity:1;
pointer-events:all;
}

.logo-big{
font-family:'Playfair Display',serif;
font-size:40px;
letter-spacing:20px;
opacity:0;
transform:translateY(200px) scale(.6);
filter:blur(10px);
}

#transition.active .logo-big{
animation:
logoIn 1.5s forwards,
logoStay 1.5s 1.5s,
logoOut 1s 3s forwards;
}

@keyframes logoIn{
to{opacity:1;transform:translateY(0) scale(1.2);filter:blur(0);}
}
@keyframes logoStay{
50%{transform:scale(1.25);}
}
@keyframes logoOut{
to{opacity:0;transform:scale(1.4);}
}
</style>
</head>

<body>

<nav>
<div class="logo">VANTA</div>
<div>
<a href="index.html">Home</a>
<a href="shop.html" class="active">Shop</a>
<a href="cart.html">Cart</a>
</div>
</nav>

<!-- SEARCH + SORT -->
<div class="top">
<input id="search" placeholder="Search...">
<select id="sort">
<option value="default">Sort</option>
<option value="new">Newest</option>
<option value="old">Oldest</option>
<option value="high">Price High</option>
<option value="low">Price Low</option>
</select>
</div>

<div id="products" class="grid"></div>

<div id="transition">
<div class="logo-big">VANTA</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const client = supabase.createClient(
"https://ojtrvxaptsavzmzjymci.supabase.co",
"sb_publishable_Qv9Pl1_DfFf4wEHS_ApMTQ_FuoR0ylh"
);

let products=[];
let filteredProducts=[];
let selectedColors={};
let originalImages={};

async function load(){
let {data} = await client.from("products").select("*");
products = data || [];
filteredProducts = [...products];
render(products);
}

function render(list){
let c=document.getElementById("products");
c.innerHTML="";

list.forEach((i,index)=>{

let colorsHTML = i.colors ? i.colors.map((c,ci)=>`
<div class="color ${ci===0?'active':''}" 
style="color:${c.hex}" 
onmouseover="hoverColor(${index},${ci})"
onmouseout="leaveColor(${index})"
onclick="selectColor(${index},${ci})"></div>
`).join("") : "";

c.innerHTML+=`
<div class="card">

<img id="img-${index}" src="${i.colors?.[0]?.image || i.image}">

<div class="info">
<h3>${i.name}</h3>
<p>${i.price} EGP</p>

<div class="colors">${colorsHTML}</div>
<div id="color-name-${index}" class="color-name">
${i.colors?.[0]?.name || ""}
</div>

<select id="size-${index}">
<option value="">Size</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<button class="btn add" onclick="add(${index})">Add</button>
<button class="btn order" onclick="orderNow(${index})">Order</button>
<button class="btn view" onclick="viewProduct(${i.id})">View</button>

</div>
</div>
`;

originalImages[index]=i.colors?.[0]?.image || i.image;
});
}

/* SEARCH */
document.getElementById("search").oninput=(e)=>{
let v=e.target.value.toLowerCase();

filteredProducts = products.filter(p =>
p.name.toLowerCase().includes(v)
);

applySort();
};

/* SORT */
document.getElementById("sort").onchange=applySort;

function applySort(){
let v=document.getElementById("sort").value;
let arr=[...filteredProducts];

if(v==="new") arr.reverse();
else if(v==="old") arr.sort((a,b)=>a.id-b.id);
else if(v==="high") arr.sort((a,b)=>b.price-a.price);
else if(v==="low") arr.sort((a,b)=>a.price-b.price);

render(arr);
}

/* باقي الكود زي ما هو */
function hoverColor(p,c){
let color=products[p].colors[c];
let img=document.getElementById("img-"+p);
img.style.opacity=.6;
setTimeout(()=>{img.src=color.image;img.style.opacity=1;},100);
document.getElementById("color-name-"+p).innerText=color.name;
}

function leaveColor(p){
let selected=selectedColors[p];
let img=document.getElementById("img-"+p);
img.style.opacity=.6;
setTimeout(()=>{
img.src=selected?.image || originalImages[p];
img.style.opacity=1;
},100);
document.getElementById("color-name-"+p).innerText=selected?.name || "";
}

function selectColor(p,c){
let color=products[p].colors[c];
selectedColors[p]=color;

let img=document.getElementById("img-"+p);
img.src=color.image;
}

function add(i){
let size=document.getElementById("size-"+i).value;
if(!size){alert("يرجى اختيار مقاس للمتابعة");return;}

let selected=selectedColors[i];
let p=products[i];

let cart=JSON.parse(localStorage.getItem("cart"))||[];

cart.push({...p,
image:selected?.image||p.image,
color:selected?.name||null,
size,
qty:1});

localStorage.setItem("cart",JSON.stringify(cart));
alert("Added ✔");
}

function orderNow(i){
let size=document.getElementById("size-"+i).value;
if(!size){alert("Select size");return;}

let p=products[i];
let selected=selectedColors[i];

localStorage.setItem("orderNow",JSON.stringify({
...p,
image:selected?.image||p.image,
color:selected?.name||null,
size,
qty:1
}));

document.getElementById("transition").classList.add("active");

setTimeout(()=>{
location.href="checkout.html";
},3500);
}

function viewProduct(id){
location.href="product.html?id="+id;
}

load();
</script>

</body>
</html>
