<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VANTA Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
--bg:#000;
--card:#0a0a0a;
--card2:#101010;
--text:#fff;
--muted:#999;
--line:#1b1b1b;
--danger:#ff3b3b;
--gold:#d7b56d;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:
radial-gradient(circle at top,#0b0b0b 0,#000 45%);
color:var(--text);
font-family:'Montserrat',sans-serif;
}

/* =========================
NAV
========================= */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
border-bottom:1px solid var(--line);
background:rgba(0,0,0,.78);
backdrop-filter:blur(12px);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-family:'Playfair Display',serif;
letter-spacing:6px;
font-size:22px;
}

.nav-links{
display:flex;
align-items:center;
gap:20px;
}

nav a{
text-decoration:none;
color:var(--muted);
position:relative;
transition:.3s;
font-size:13px;
white-space:nowrap;
}

nav a::after{
content:"";
position:absolute;
bottom:-6px;
left:0;
width:0;
height:1px;
background:#fff;
transition:.3s;
}

nav a:hover{
color:#fff;
}

nav a:hover::after,
nav a.active::after{
width:100%;
}

nav a.active{
color:#fff;
}

.nav-badge{
display:inline-flex;
align-items:center;
justify-content:center;
min-width:18px;
height:18px;
padding:0 5px;
margin-left:4px;
border-radius:50px;
background:#fff;
color:#000;
font-size:10px;
}

/* =========================
CATEGORY BAR
========================= */

.categories{
display:flex;
gap:10px;
padding:18px 60px 5px;
overflow-x:auto;
scrollbar-width:none;
}

.categories::-webkit-scrollbar{
display:none;
}

.category{
flex:none;
padding:9px 15px;
border:1px solid var(--line);
background:#080808;
color:#888;
border-radius:30px;
cursor:pointer;
font-size:12px;
transition:.25s;
}

.category:hover{
color:#fff;
border-color:#444;
}

.category.active{
background:#fff;
color:#000;
border-color:#fff;
}

/* =========================
TOP CONTROLS
========================= */

.top{
display:flex;
gap:10px;
padding:20px 60px;
flex-wrap:wrap;
align-items:center;
}

.search-wrap{
position:relative;
flex:1;
min-width:220px;
}

.search-wrap span{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:#666;
font-size:13px;
}

#search{
width:100%;
padding:12px 12px 12px 34px;
}

.top input,
.top select{
padding:11px;
background:#0a0a0a;
color:#fff;
border:1px solid #1a1a1a;
border-radius:6px;
outline:none;
}

.top select{
min-width:160px;
}

.top input:focus,
.top select:focus{
border-color:#555;
}

/* =========================
FILTER BUTTON
========================= */

.filter-toggle{
padding:11px 16px;
background:#111;
color:#fff;
border:1px solid #333;
border-radius:6px;
cursor:pointer;
transition:.25s;
}

.filter-toggle:hover{
background:#fff;
color:#000;
}

/* =========================
FILTER PANEL
========================= */

.filters{
margin:0 60px;
padding:0;
max-height:0;
overflow:hidden;
opacity:0;
border:1px solid transparent;
transition:.35s;
}

.filters.open{
max-height:700px;
opacity:1;
padding:20px;
border-color:var(--line);
background:#070707;
}

.filter-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:15px;
}

.filter-box{
background:#0c0c0c;
border:1px solid #181818;
padding:15px;
border-radius:10px;
}

.filter-title{
font-size:11px;
color:#888;
margin-bottom:10px;
text-transform:uppercase;
letter-spacing:1px;
}

.filter-options{
display:flex;
flex-wrap:wrap;
gap:7px;
}

.filter-option{
padding:6px 9px;
border:1px solid #292929;
border-radius:6px;
font-size:11px;
color:#aaa;
cursor:pointer;
transition:.2s;
}

.filter-option:hover{
color:#fff;
border-color:#666;
}

.filter-option.active{
background:#fff;
color:#000;
border-color:#fff;
}

.price-row{
display:flex;
gap:8px;
}

.price-row input{
width:50%;
min-width:0;
}

.clear-filters{
margin-top:15px;
padding:9px 15px;
background:transparent;
border:1px solid #333;
color:#aaa;
border-radius:6px;
cursor:pointer;
}

.clear-filters:hover{
color:#fff;
border-color:#fff;
}

/* =========================
RESULT INFO
========================= */

.result-bar{
display:flex;
justify-content:space-between;
align-items:center;
padding:5px 60px 0;
color:#666;
font-size:12px;
}

#activeFilters{
color:#aaa;
}

/* =========================
GRID
========================= */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:30px;
padding:35px 60px 60px;
}

/* =========================
CARD
========================= */

.card{
position:relative;
background:var(--card);
border:1px solid #1a1a1a;
border-radius:16px;
overflow:hidden;
transition:.35s;
}

.card:hover{
transform:translateY(-8px);
border-color:#292929;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.card-image-wrap{
position:relative;
overflow:hidden;
}

.card img{
display:block;
width:100%;
height:300px;
object-fit:cover;
transition:.4s;
}

.card:hover img{
transform:scale(1.025);
}

.badge{
position:absolute;
top:12px;
left:12px;
background:#fff;
color:#000;
padding:6px 9px;
border-radius:20px;
font-size:9px;
letter-spacing:1px;
z-index:2;
}

.compare-btn{
position:absolute;
top:12px;
right:12px;
width:34px;
height:34px;
padding:0;
margin:0;
border-radius:50%;
background:rgba(0,0,0,.75);
color:#aaa;
border:1px solid #333;
cursor:pointer;
z-index:3;
transition:.25s;
}

.compare-btn:hover,
.compare-btn.active{
background:#fff;
color:#000;
}

.info{
padding:18px;
}

.product-meta{
display:flex;
justify-content:space-between;
gap:10px;
align-items:flex-start;
}

.product-meta h3{
margin:0;
font-family:'Playfair Display',serif;
font-size:18px;
font-weight:700;
}

.price{
white-space:nowrap;
font-size:14px;
}

.brand{
color:#666;
font-size:10px;
margin-top:5px;
}

.rating{
margin-top:7px;
color:var(--gold);
font-size:11px;
}

.rating span{
color:#666;
margin-left:4px;
}

/* =========================
COLORS
========================= */

.colors{
display:flex;
gap:10px;
margin:12px 0 5px;
}

.color{
width:22px;
height:22px;
border-radius:50%;
cursor:pointer;
border:2px solid #333;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
}

.color::after{
content:"";
width:10px;
height:10px;
border-radius:50%;
background:currentColor;
}

.color:hover{
transform:scale(1.15);
}

.color.active{
border:2px solid #fff;
}

.color-name{
font-size:12px;
color:#888;
min-height:17px;
}

/* =========================
SIZE
========================= */

.size-select{
width:100%;
padding:10px;
margin-top:10px;
background:#0a0a0a;
color:#fff;
border:1px solid #222;
border-radius:7px;
outline:none;
}

/* =========================
BUTTONS
========================= */

.btn{
width:100%;
margin-top:10px;
padding:12px;
border:none;
cursor:pointer;
border-radius:8px;
transition:.25s;
font-family:'Montserrat',sans-serif;
}

.add{
background:#fff;
color:#000;
}

.order{
background:#111;
color:#fff;
border:1px solid #333;
}

.view{
background:transparent;
color:#fff;
border:1px solid #555;
}

.btn:hover{
transform:translateY(-2px);
}

.btn:active{
transform:scale(.98);
}

/* =========================
EMPTY
========================= */

.empty{
grid-column:1/-1;
text-align:center;
padding:80px 20px;
color:#666;
}

.empty h2{
font-family:'Playfair Display',serif;
color:#aaa;
}

/* =========================
COMPARE BAR
========================= */

.compare-bar{
position:fixed;
left:50%;
bottom:-100px;
transform:translateX(-50%);
width:min(700px,calc(100% - 30px));
background:#111;
border:1px solid #333;
padding:12px 15px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
z-index:2000;
transition:.35s;
box-shadow:0 20px 60px rgba(0,0,0,.7);
}

.compare-bar.show{
bottom:20px;
}

.compare-count{
font-size:12px;
color:#aaa;
}

.compare-action{
padding:10px 16px;
background:#fff;
color:#000;
border:0;
border-radius:7px;
cursor:pointer;
}

.clear-compare{
background:transparent;
color:#888;
border:0;
cursor:pointer;
}

/* =========================
TOAST
========================= */

.toast{
position:fixed;
bottom:25px;
right:25px;
background:#111;
color:#fff;
border:1px solid #333;
padding:13px 17px;
border-radius:8px;
opacity:0;
transform:translateY(15px);
pointer-events:none;
transition:.3s;
z-index:10000;
font-size:12px;
}

.toast.show{
opacity:1;
transform:translateY(0);
}

/* =========================
TRANSITION
========================= */

#transition{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
z-index:9999;
transition:.5s;
}

#transition.active{
opacity:1;
pointer-events:all;
}

.logo-big{
font-family:'Playfair Display',serif;
font-size:40px;
letter-spacing:20px;
opacity:0;
transform:translateY(200px) scale(.6);
filter:blur(10px);
}

#transition.active .logo-big{
animation:
logoIn 1.5s forwards,
logoStay 1.5s 1.5s,
logoOut 1s 3s forwards;
}

@keyframes logoIn{
to{
opacity:1;
transform:translateY(0) scale(1.2);
filter:blur(0);
}
}

@keyframes logoStay{
50%{
transform:scale(1.25);
}
}

@keyframes logoOut{
to{
opacity:0;
transform:scale(1.4);
}
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

nav{
padding:18px 25px;
}

.nav-links{
gap:12px;
}

.categories,
.top{
padding-left:25px;
padding-right:25px;
}

.grid{
padding-left:25px;
padding-right:25px;
}

.result-bar{
padding-left:25px;
padding-right:25px;
}

.filters{
margin-left:25px;
margin-right:25px;
}

.filter-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

nav{
flex-direction:column;
gap:15px;
}

.nav-links{
width:100%;
justify-content:center;
flex-wrap:wrap;
}

.grid{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.card img{
height:220px;
}

.info{
padding:12px;
}

.product-meta{
flex-direction:column;
}

.filter-grid{
grid-template-columns:1fr;
}

.filters.open{
max-height:1000px;
}

.top select{
flex:1;
min-width:130px;
}

.result-bar{
gap:10px;
align-items:flex-start;
flex-direction:column;
}

}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

/* =====================================================
SUPABASE
===================================================== */

const client = supabase.createClient(
"https://ojtrvxaptsavzmzjymci.supabase.co",
"sb_publishable_Qv9Pl1_DfFf4wEHS_ApMTQ_FuoR0ylh"
);

/* =====================================================
PRODUCT TABLE
===================================================== */

const PRODUCT_TABLE = "product_2";

/* =====================================================
GLOBAL DATA
===================================================== */

let products = [];

let filteredProducts = [];

let selectedColors = {};

let originalImages = {};

let selectedCategory = "all";

let selectedSizes = [];

let selectedColorsFilter = [];

let selectedBrands = [];

let selectedMaterials = [];

let selectedRating = null;

let compareProducts = JSON.parse(
localStorage.getItem("compareProducts")
) || [];

/* =====================================================
HELPERS
===================================================== */

function escapeHTML(value){

if(value === null || value === undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* =====================================================
CATEGORY
===================================================== */

function getProductCategory(product){

return (
product.category ||
product.categories ||
""
);

}

/* =====================================================
BRAND
===================================================== */

function getProductBrand(product){

return product.brand || "";

}

/* =====================================================
MATERIAL
===================================================== */

function getProductMaterial(product){

return product.material || "";

}

/* =====================================================
DESCRIPTION
===================================================== */

function getProductDescription(product){

return (
product.description ||
product.desc ||
""
);

}

/* =====================================================
RATING
===================================================== */

function getProductRating(product){

return Number(
product.rating || 0
);

}

/* =====================================================
POPULARITY
===================================================== */

function getProductPopularity(product){

return Number(
product.sales_count ||
product.sales ||
product.views ||
product.popularity ||
0
);

}

/* =====================================================
DATE
===================================================== */

function getProductDate(product){

return product.created_at
? new Date(product.created_at).getTime()
: Number(product.id) || 0;

}

/* =====================================================
COLORS
===================================================== */

function getProductColors(product){

if(Array.isArray(product.colors)){

return product.colors;

}

/*
If colors was saved as JSON text
*/

if(typeof product.colors === "string"){

try{

const parsed =
JSON.parse(product.colors);

return Array.isArray(parsed)
? parsed
: [];

}catch(error){

console.warn(
"Invalid colors JSON:",
product.colors
);

}

}

return [];

}

/* =====================================================
MAIN PRODUCT IMAGE
===================================================== */

function getProductImage(product){

return (
product.image ||
product.image_url ||
product.main_image ||
product.product_image ||
""
);

}

/* =====================================================
COLOR IMAGE
===================================================== */

function getColorImage(color,product){

return (
color?.image ||
color?.image_url ||
getProductImage(product)
);

}

/* =====================================================
SIZE STOCK
===================================================== */

function getSizeStock(color,size){

if(!color || !color.sizes){

return 0;

}

return Number(
color.sizes[size] || 0
);

}

/* =====================================================
TOTAL STOCK
===================================================== */

function getTotalStock(product){

const colors =
getProductColors(product);

let total = 0;

colors.forEach(color => {

if(!color.sizes){
return;
}

Object.values(color.sizes)
.forEach(quantity => {

total += Number(quantity || 0);

});

});

return total;

}

/* =====================================================
PRODUCT HAS SIZE
===================================================== */

function productHasSize(product,size){

return getProductColors(product).some(color => {

if(!color.sizes){
return false;
}

return (
Number(color.sizes[size] || 0) > 0
);

});

}

/* =====================================================
PRODUCT HAS COLOR
===================================================== */

function productHasColor(product,colorName){

return getProductColors(product).some(color =>

String(color.name || "").toLowerCase() ===
String(colorName || "").toLowerCase()

);

}

/* =====================================================
TOAST
===================================================== */

function showToast(message){

const toast =
document.getElementById("toast");

toast.innerText = message;

toast.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer = setTimeout(() => {

toast.classList.remove("show");

},2200);

}

/* =====================================================
LOAD PRODUCTS
===================================================== */

async function load(){

const {
data,
error
} = await client
.from(PRODUCT_TABLE)
.select("*")
.order("id",{ascending:true});

if(error){

console.error(
"Supabase products error:",
error
);

document.getElementById("products").innerHTML = `
<div class="empty">
<h2>Unable to load products</h2>
<p>
${escapeHTML(error.message)}
</p>
</div>
`;

return;
}

products = data || [];

filteredProducts = [...products];

buildFilters();

updateCartCount();

applyFilters();

}

/* =====================================================
BUILD FILTERS
===================================================== */

function buildFilters(){

const sizes = new Set();

const colors = new Map();

const brands = new Set();

const materials = new Set();

products.forEach(product => {

getProductColors(product).forEach(color => {

if(color.sizes){

Object.keys(color.sizes)
.forEach(size => {

if(
Number(color.sizes[size] || 0) >= 0
){

sizes.add(size);

}

});

}

if(color.name){

colors.set(
color.name,
color.hex || "#777"
);

}

});

const brand =
getProductBrand(product);

if(brand){

brands.add(brand);

}

const material =
getProductMaterial(product);

if(material){

materials.add(material);

}

});

renderFilterButtons(
"sizeFilters",
[...sizes].sort(),
"size"
);

renderColorFilterButtons(colors);

renderFilterButtons(
"brandFilters",
[...brands].sort(),
"brand"
);

renderFilterButtons(
"materialFilters",
[...materials].sort(),
"material"
);

}

/* =====================================================
FILTER BUTTONS
===================================================== */

function renderFilterButtons(
containerId,
values,
type
){

const container =
document.getElementById(containerId);

container.innerHTML = "";

values.forEach(value => {

const button =
document.createElement("div");

button.className =
"filter-option";

button.innerText =
value;

button.dataset.type =
type;

button.dataset.value =
value;

button.onclick = () => {

button.classList.toggle("active");

if(type === "size"){

toggleArrayValue(
selectedSizes,
value
);

}

if(type === "brand"){

toggleArrayValue(
selectedBrands,
value
);

}

if(type === "material"){

toggleArrayValue(
selectedMaterials,
value
);

}

applyFilters();

};

container.appendChild(button);

});

}

/* =====================================================
COLOR FILTER BUTTONS
===================================================== */

function renderColorFilterButtons(colors){

const container =
document.getElementById("colorFilters");

container.innerHTML = "";

colors.forEach((hex,name) => {

const button =
document.createElement("div");

button.className =
"filter-option";

button.innerHTML = `
<span style="
display:inline-block;
width:10px;
height:10px;
border-radius:50%;
background:${escapeHTML(hex)};
margin-right:5px;
"></span>
${escapeHTML(name)}
`;

button.onclick = () => {

button.classList.toggle("active");

toggleArrayValue(
selectedColorsFilter,
name
);

applyFilters();

};

container.appendChild(button);

});

}

/* =====================================================
ARRAY TOGGLE
===================================================== */

function toggleArrayValue(
array,
value
){

const index =
array.indexOf(value);

if(index === -1){

array.push(value);

}else{

array.splice(index,1);

}

}

/* =====================================================
CATEGORY
===================================================== */

document
.querySelectorAll(".category")
.forEach(category => {

category.addEventListener(
"click",
() => {

document
.querySelectorAll(".category")
.forEach(x =>
x.classList.remove("active")
);

category.classList.add("active");

selectedCategory =
category.dataset.category;

applyFilters();

}
);

});

/* =====================================================
SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener(
"input",
applyFilters
);

/* =====================================================
SORT
===================================================== */

document
.getElementById("sort")
.addEventListener(
"change",
applyFilters
);

/* =====================================================
PRICE
===================================================== */

document
.getElementById("minPrice")
.addEventListener(
"input",
applyFilters
);

document
.getElementById("maxPrice")
.addEventListener(
"input",
applyFilters
);

/* =====================================================
RATING
===================================================== */

document
.querySelectorAll(
"#ratingFilters .filter-option"
)
.forEach(button => {

button.addEventListener(
"click",
() => {

document
.querySelectorAll(
"#ratingFilters .filter-option"
)
.forEach(x =>
x.classList.remove("active")
);

button.classList.add("active");

selectedRating =
Number(button.dataset.rating);

applyFilters();

}
);

});

/* =====================================================
APPLY FILTERS
===================================================== */

function applyFilters(){

const search =
document
.getElementById("search")
.value
.toLowerCase()
.trim();

const minPrice =
Number(
document
.getElementById("minPrice")
.value
) || 0;

const maxPriceValue =
document
.getElementById("maxPrice")
.value;

const maxPrice =
maxPriceValue === ""
? Infinity
: Number(maxPriceValue);

filteredProducts =
products.filter(product => {

const searchable = [

product.name,

product.brand,

product.material,

product.category,

product.description

]
.filter(Boolean)
.join(" ")
.toLowerCase();

if(
search &&
!searchable.includes(search)
){

return false;

}

if(
selectedCategory !== "all"
){

const category =
getProductCategory(product)
.toString()
.toLowerCase();

if(
!category.includes(
selectedCategory.toLowerCase()
)
){

return false;

}

}

const price =
Number(product.price) || 0;

if(
price < minPrice ||
price > maxPrice
){

return false;

}

if(
selectedSizes.length &&
!selectedSizes.some(size =>
productHasSize(
product,
size
)
)
){

return false;

}

if(
selectedColorsFilter.length &&
!selectedColorsFilter.some(color =>
productHasColor(
product,
color
)
)
){

return false;

}

if(
selectedBrands.length &&
!selectedBrands.includes(
getProductBrand(product)
)
){

return false;

}

if(
selectedMaterials.length &&
!selectedMaterials.includes(
getProductMaterial(product)
)
){

return false;

}

if(
selectedRating !== null &&
getProductRating(product) <
selectedRating
){

return false;

}

return true;

});

applySorting();

}

/* =====================================================
SORT
===================================================== */

function applySorting(){

const sort =
document
.getElementById("sort")
.value;

const arr =
[...filteredProducts];

if(sort === "new"){

arr.sort(
(a,b) =>
getProductDate(b) -
getProductDate(a)
);

}

else if(sort === "low"){

arr.sort(
(a,b) =>
Number(a.price || 0) -
Number(b.price || 0)
);

}

else if(sort === "high"){

arr.sort(
(a,b) =>
Number(b.price || 0) -
Number(a.price || 0)
);

}

else if(sort === "popular"){

arr.sort(
(a,b) =>
getProductPopularity(b) -
getProductPopularity(a)
);

}

else{

/*
Default = ID order
*/

arr.sort(
(a,b) =>
Number(a.id || 0) -
Number(b.id || 0)
);

}

filteredProducts = arr;

render(filteredProducts);

}

/* =====================================================
RENDER
===================================================== */

function render(list){

const container =
document.getElementById("products");

container.innerHTML = "";

document.getElementById(
"resultCount"
).innerText =
`${list.length} product${list.length === 1 ? "" : "s"}`;

updateActiveFilters();

if(!list.length){

container.innerHTML = `
<div class="empty">

<h2>No products found</h2>

<p>
Try changing your search or filters.
</p>

</div>
`;

return;

}

list.forEach(product => {

const card =
createProductCard(product);

container.appendChild(card);

});

}

/* =====================================================
PRODUCT CARD
===================================================== */

function createProductCard(product){

const card =
document.createElement("div");

card.className =
"card";

const colors =
getProductColors(product);

const firstColor =
colors[0];

const image =
getColorImage(
firstColor,
product
);

originalImages[product.id] =
image;

if(
!selectedColors[product.id] &&
firstColor
){

selectedColors[product.id] =
firstColor;

}

const selected =
selectedColors[product.id] ||
firstColor ||
null;

const rating =
getProductRating(product);

const ratingHTML =
rating > 0
? `
<div class="rating">
${"★".repeat(
Math.round(rating)
)}
<span>
${rating.toFixed(1)}
</span>
</div>
`
: "";

const brand =
getProductBrand(product);

const description =
getProductDescription(product);

const totalStock =
getTotalStock(product);

const isCompared =
compareProducts.some(
p =>
String(p.id) ===
String(product.id)
);

let colorsHTML = "";

colors.forEach(color => {

const isActive =
selected &&
selected.name === color.name;

const colorElement =
document.createElement("div");

colorElement.className =
"color" +
(isActive ? " active" : "");

colorElement.style.color =
color.hex || "#777";

colorElement.title =
color.name || "";

colorElement.onclick = event => {

event.stopPropagation();

selectColor(
product.id,
color
);

};

colorsHTML +=
colorElement.outerHTML;

});

card.innerHTML = `

<div class="card-image-wrap">

${
getProductPopularity(product) > 0
? `
<div class="badge">
POPULAR
</div>
`
: ""
}

<button
class="
compare-btn
${isCompared ? "active" : ""}
"
title="Compare"
type="button"
>
⇄
</button>

<img
id="img-${product.id}"
src="${escapeHTML(image)}"
alt="${escapeHTML(product.name)}"
>

</div>

<div class="info">

<div class="product-meta">

<div>

<h3>
${escapeHTML(product.name)}
</h3>

${
brand
? `
<div class="brand">
${escapeHTML(brand)}
</div>
`
: ""
}

</div>

<div class="price">
${escapeHTML(product.price)} EGP
</div>

</div>

${
description
? `
<div style="
color:#777;
font-size:11px;
line-height:1.6;
margin-top:8px;
">
${escapeHTML(description)}
</div>
`
: ""
}

${ratingHTML}

<div class="colors">
${colorsHTML}
</div>

<div
id="color-name-${product.id}"
class="color-name"
>
${escapeHTML(
selected?.name || ""
)}
</div>

<select
id="size-${product.id}"
class="size-select"
>

<option value="">
Size
</option>

${buildSizeOptions(selected)}

</select>

<div
id="stock-${product.id}"
style="
font-size:11px;
color:#777;
margin-top:7px;
min-height:16px;
"
>
Select a size
</div>

<button
class="btn add"
type="button"
>
Add
</button>

<button
class="btn order"
type="button"
>
Order
</button>

<button
class="btn view"
type="button"
>
View
</button>

</div>
`;

/* =====================================================
SIZE CHANGE
===================================================== */

const sizeSelect =
card.querySelector(
".size-select"
);

sizeSelect.addEventListener(
"change",
() => {

updateStockText(
product,
selectedColors[product.id] ||
firstColor,
sizeSelect.value
);

}
);

/* =====================================================
COMPARE
===================================================== */

card
.querySelector(".compare-btn")
.onclick = () => {

toggleCompare(product);

};

/* =====================================================
ADD
===================================================== */

card
.querySelector(".add")
.onclick = () => {

add(product);

};

/* =====================================================
ORDER
===================================================== */

card
.querySelector(".order")
.onclick = () => {

orderNow(product);

};

/* =====================================================
VIEW
===================================================== */

card
.querySelector(".view")
.onclick = () => {

viewProduct(product.id);

};

return card;

}

/* =====================================================
SIZE OPTIONS
===================================================== */

function buildSizeOptions(color){

if(
!color ||
!color.sizes
){

return `
<option value="">
No sizes
</option>
`;

}

return Object.entries(
color.sizes
)
.map(([size,quantity]) => {

const stock =
Number(quantity || 0);

const disabled =
stock <= 0
? "disabled"
: "";

return `
<option
value="${escapeHTML(size)}"
${disabled}
>
${escapeHTML(size)}
${
stock <= 0
? " — Out of stock"
: ""
}
</option>
`;

})
.join("");

}

/* =====================================================
UPDATE STOCK TEXT
===================================================== */

function updateStockText(
product,
color,
size
){

const stockElement =
document.getElementById(
`stock-${product.id}`
);

if(!stockElement){

return;

}

if(!size){

stockElement.innerText =
"Select a size";

stockElement.style.color =
"#777";

return;

}

const stock =
getSizeStock(
color,
size
);

if(stock <= 0){

stockElement.innerText =
"Out of stock";

stockElement.style.color =
"#ff3b3b";

return;

}

stockElement.innerText =
`${stock} available in stock`;

stockElement.style.color =
stock <= 3
? "#ffb347"
: "#777";

}

/* =====================================================
SELECT COLOR
===================================================== */

function selectColor(
productId,
color
){

selectedColors[productId] =
color;

const product =
products.find(
p =>
String(p.id) ===
String(productId)
);

const image =
document.getElementById(
`img-${productId}`
);

if(image){

image.style.opacity =
".5";

setTimeout(() => {

image.src =
getColorImage(
color,
product || {}
);

image.style.opacity =
"1";

},100);

}

const name =
document.getElementById(
`color-name-${productId}`
);

if(name){

name.innerText =
color.name || "";

}

const card =
image?.closest(".card");

if(card){

card
.querySelectorAll(".color")
.forEach(el =>
el.classList.remove("active")
);

const colorIndex =
getProductColors(
product || {}
)
.findIndex(
x =>
x.name === color.name
);

if(colorIndex >= 0){

const elements =
card.querySelectorAll(
".color"
);

elements[colorIndex]
?.classList.add("active");

}

const sizeSelect =
card.querySelector(
".size-select"
);

if(sizeSelect){

sizeSelect.innerHTML = `

<option value="">
Size
</option>

${buildSizeOptions(color)}

`;

}

const stock =
document.getElementById(
`stock-${productId}`
);

if(stock){

stock.innerText =
"Select a size";

stock.style.color =
"#777";

}

}

}

/* =====================================================
ADD TO CART
===================================================== */

function add(product){

const sizeSelect =
document.getElementById(
`size-${product.id}`
);

const size =
sizeSelect?.value || "";

if(!size){

showToast(
"Please select a size"
);

return;

}

const selected =
selectedColors[product.id] ||
getProductColors(product)[0];

const stock =
getSizeStock(
selected,
size
);

if(stock <= 0){

showToast(
"Out of stock"
);

return;

}

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const existingIndex =
cart.findIndex(item =>

String(item.product_id || item.id) ===
String(product.id) &&

String(item.color || "") ===
String(selected?.name || "") &&

String(item.size || "") ===
String(size)

);

if(existingIndex >= 0){

const currentQty =
Number(
cart[existingIndex].qty || 1
);

if(currentQty >= stock){

showToast(
"Maximum stock reached"
);

return;

}

cart[existingIndex].qty =
currentQty + 1;

}else{

cart.push({

...product,

product_id:
product.id,

image:
getColorImage(
selected,
product
),

color:
selected?.name ||
null,

size,

qty:1

});

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

updateCartCount();

showToast(
"Added to Cart ✔"
);

}

/* =====================================================
ORDER NOW
===================================================== */

function orderNow(product){

const sizeSelect =
document.getElementById(
`size-${product.id}`
);

const size =
sizeSelect?.value || "";

if(!size){

showToast(
"Please select a size"
);

return;

}

const selected =
selectedColors[product.id] ||
getProductColors(product)[0];

const stock =
getSizeStock(
selected,
size
);

if(stock <= 0){

showToast(
"Out of stock"
);

return;

}

localStorage.setItem(
"orderNow",
JSON.stringify({

...product,

product_id:
product.id,

image:
getColorImage(
selected,
product
),

color:
selected?.name ||
null,

size,

qty:1

})
);

document
.getElementById("transition")
.classList.add("active");

setTimeout(() => {

location.href =
"checkout.html";

},3500);

}

/* =====================================================
VIEW PRODUCT
===================================================== */

function viewProduct(id){

addRecentlyViewed(id);

location.href =
"product.html?id=" +
encodeURIComponent(id);

}

/* =====================================================
RECENTLY VIEWED
===================================================== */

function addRecentlyViewed(id){

let recent =
JSON.parse(
localStorage.getItem(
"recentlyViewed"
)
) || [];

recent =
recent.filter(
item =>
String(item) !==
String(id)
);

recent.unshift(id);

recent =
recent.slice(0,12);

localStorage.setItem(
"recentlyViewed",
JSON.stringify(recent)
);

}

/* =====================================================
CART COUNT
===================================================== */

function updateCartCount(){

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const count =
cart.reduce(
(total,item) =>
total +
Number(item.qty || 1),
0
);

const badge =
document.getElementById(
"cartCount"
);

if(badge){

badge.innerText =
count > 99
? "99+"
: count;

}

}

/* =====================================================
COMPARE
===================================================== */

function toggleCompare(product){

const index =
compareProducts.findIndex(
p =>
String(p.id) ===
String(product.id)
);

if(index >= 0){

compareProducts.splice(
index,
1
);

showToast(
"Removed from comparison"
);

}else{

if(compareProducts.length >= 4){

showToast(
"Maximum 4 products"
);

return;

}

compareProducts.push({

id:
product.id,

name:
product.name,

price:
product.price,

image:
getProductImage(product) ||
getColorImage(
getProductColors(product)[0],
product
),

brand:
product.brand,

material:
product.material,

description:
product.description,

rating:
product.rating,

category:
product.category

});

showToast(
"Added to Compare"
);

}

localStorage.setItem(
"compareProducts",
JSON.stringify(
compareProducts
)
);

updateCompareBar();

render(filteredProducts);

}

/* =====================================================
COMPARE BAR
===================================================== */

function updateCompareBar(){

const bar =
document.getElementById(
"compareBar"
);

const count =
document.getElementById(
"compareCount"
);

count.innerText =
`${compareProducts.length} product${
compareProducts.length === 1
? ""
: "s"
} selected`;

if(compareProducts.length){

bar.classList.add("show");

}else{

bar.classList.remove("show");

}

}

/* =====================================================
OPEN COMPARE
===================================================== */

document
.getElementById("compareAction")
.onclick = () => {

if(!compareProducts.length){

showToast(
"Select products first"
);

return;

}

localStorage.setItem(
"compareProducts",
JSON.stringify(
compareProducts
)
);

location.href =
"compare.html";

};

/* =====================================================
CLEAR COMPARE
===================================================== */

document
.getElementById("clearCompare")
.onclick = () => {

compareProducts = [];

localStorage.removeItem(
"compareProducts"
);

updateCompareBar();

render(filteredProducts);

};

/* =====================================================
FILTER TOGGLE
===================================================== */

document
.getElementById("filterToggle")
.onclick = () => {

document
.getElementById("filters")
.classList.toggle("open");

};

/* =====================================================
CLEAR FILTERS
===================================================== */

document
.getElementById("clearFilters")
.onclick = () => {

selectedSizes = [];

selectedColorsFilter = [];

selectedBrands = [];

selectedMaterials = [];

selectedRating = null;

selectedCategory = "all";

document
.getElementById("search")
.value = "";

document
.getElementById("minPrice")
.value = "";

document
.getElementById("maxPrice")
.value = "";

document
.getElementById("sort")
.value = "default";

document
.querySelectorAll(
".filter-option"
)
.forEach(x =>
x.classList.remove("active")
);

document
.querySelectorAll(".category")
.forEach(x =>
x.classList.remove("active")
);

document
.querySelector(
'.category[data-category="all"]'
)
.classList.add("active");

applyFilters();

};

/* =====================================================
ACTIVE FILTER TEXT
===================================================== */

function updateActiveFilters(){

const active =
[];

if(selectedCategory !== "all"){

active.push(
selectedCategory
);

}

if(selectedSizes.length){

active.push(
...selectedSizes
);

}

if(selectedColorsFilter.length){

active.push(
...selectedColorsFilter
);

}

if(selectedBrands.length){

active.push(
...selectedBrands
);

}

if(selectedMaterials.length){

active.push(
...selectedMaterials
);

}

if(selectedRating){

active.push(
`${selectedRating}+ ★`
);

}

const min =
document
.getElementById("minPrice")
.value;

const max =
document
.getElementById("maxPrice")
.value;

if(min || max){

active.push(
`${min || 0} - ${max || "∞"} EGP`
);

}

document
.getElementById(
"activeFilters"
)
.innerText =
active.length
? active.join(" · ")
: "";

}

/* =====================================================
INITIALIZE
===================================================== */

updateCompareBar();

load();

</script>
